<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Juan Gomez — Software Engineer</title>
  <desc id="description">Developer tools, AI workflows, and local-first products built with Go and TypeScript.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.52" stop-color="#0d1b31" />
      <stop offset="1" stop-color="#151c35" />
    </linearGradient>
    <radialGradient id="cyan-glow" cx="0" cy="0" r="1" gradientTransform="translate(196 70) rotate(31) scale(430 240)">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".23" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violet-glow" cx="0" cy="0" r="1" gradientTransform="translate(1060 252) rotate(-142) scale(460 260)">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".28" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#94a3b8" stroke-opacity=".065" stroke-width="1" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity=".45" />
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)" />
  <rect width="1200" height="300" rx="24" fill="url(#grid)" />
  <rect width="1200" height="300" rx="24" fill="url(#cyan-glow)" />
  <rect width="1200" height="300" rx="24" fill="url(#violet-glow)" />

  <g opacity=".8">
    <path d="M 0 236 C 190 176 288 314 468 240 S 790 176 936 232 1086 292 1200 220" fill="none" stroke="url(#accent)" stroke-opacity=".16" stroke-width="2" />
    <circle cx="468" cy="240" r="4" fill="#67e8f9" />
    <circle cx="936" cy="232" r="4" fill="#a78bfa" />
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="72" y="61" fill="#67e8f9" font-size="17" font-weight="700" letter-spacing="2.8">NEWBPYDEV // SOFTWARE ENGINEER</text>
    <text x="70" y="139" fill="#f8fafc" font-size="64" font-weight="800" letter-spacing="-2.2">JUAN GOMEZ</text>
    <text x="73" y="181" fill="#cbd5e1" font-size="21" font-weight="500">Developer Tools · AI Workflows · Local-First Products</text>

    <g font-size="14" font-weight="700" letter-spacing="1.2">
      <g>
        <rect x="72" y="214" width="72" height="34" rx="17" fill="#0f2c3b" stroke="#67e8f9" stroke-opacity=".5" />
        <text x="108" y="236" fill="#a5f3fc" text-anchor="middle">GO</text>
      </g>
      <g>
        <rect x="156" y="214" width="138" height="34" rx="17" fill="#15264a" stroke="#60a5fa" stroke-opacity=".5" />
        <text x="225" y="236" fill="#bfdbfe" text-anchor="middle">TYPESCRIPT</text>
      </g>
      <g>
        <rect x="306" y="214" width="140" height="34" rx="17" fill="#292044" stroke="#a78bfa" stroke-opacity=".5" />
        <text x="376" y="236" fill="#ddd6fe" text-anchor="middle">OPEN SOURCE</text>
      </g>
      <g>
        <rect x="458" y="214" width="102" height="34" rx="17" fill="#162f2c" stroke="#34d399" stroke-opacity=".45" />
        <text x="509" y="236" fill="#a7f3d0" text-anchor="middle">BRAZIL</text>
      </g>
    </g>
  </g>

  <g transform="translate(826 50)" filter="url(#shadow)">
    <rect width="302" height="194" rx="15" fill="#08111f" stroke="#64748b" stroke-opacity=".28" />
    <path d="M 0 42 H 302" stroke="#64748b" stroke-opacity=".22" />
    <circle cx="23" cy="21" r="5" fill="#fb7185" />
    <circle cx="42" cy="21" r="5" fill="#fbbf24" />
    <circle cx="61" cy="21" r="5" fill="#34d399" />
    <text x="151" y="26" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" text-anchor="middle">~/build</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">
      <text x="22" y="76" fill="#67e8f9">$</text>
      <text x="41" y="76" fill="#e2e8f0">engineer --with-intent</text>
      <text x="22" y="108" fill="#34d399">✓</text>
      <text x="46" y="108" fill="#94a3b8">design the workflow</text>
      <text x="22" y="137" fill="#34d399">✓</text>
      <text x="46" y="137" fill="#94a3b8">verify the behavior</text>
      <text x="22" y="166" fill="#34d399">✓</text>
      <text x="46" y="166" fill="#94a3b8">ship with confidence</text>
      <rect x="250" y="153" width="9" height="17" fill="#a78bfa" />
    </g>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="298.5" rx="23.25" fill="none" stroke="#94a3b8" stroke-opacity=".14" stroke-width="1.5" />
</svg>
